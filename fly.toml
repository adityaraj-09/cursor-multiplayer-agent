app = "shared-agent-session"
primary_region = "sjc"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"

# Socket.IO needs sticky sessions for multi-instance; single instance is fine without.
# For multi-instance: add a Redis adapter or use Fly's session-affinity header.
[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

# API + WebSocket traffic on port 3000
[[services]]
  internal_port = 3000
  protocol = "tcp"

  [services.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
