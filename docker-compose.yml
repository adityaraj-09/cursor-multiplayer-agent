services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file: .env.production
    environment:
      - DATABASE_URL=postgres://shared_agent:shared_agent@db:5432/shared_agent
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-data:/app/data
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shared_agent
      POSTGRES_PASSWORD: shared_agent
      POSTGRES_DB: shared_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shared_agent"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  app-data:
